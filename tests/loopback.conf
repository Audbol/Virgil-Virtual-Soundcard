# Loopback config for local testing: transmits to 127.0.0.1 and receives it back.
# virgild -c tests/loopback.conf
[device]
name = Virgil Loop
interface = 127.0.0.1
tx_channels = 2
rx_channels = 2
packet_time_us = 1000
latency_us = 4000
clock = free
sap = false
lock_memory = false
[tx]
address = 127.0.0.1
port = 25010
channels = 2
[rx]
port = 25010
channels = 2
