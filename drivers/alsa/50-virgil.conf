# ALSA configuration for the Virgil virtual soundcard.
# Install to /etc/alsa/conf.d/ (or include from ~/.asoundrc).

pcm_type.virgil {
	lib "libasound_module_pcm_virgil.so"
}

# Raw device: exact channel count, sample rate and formats of virgild.
pcm.virgil_hw {
	type virgil
	# shm "/virgil-soundcard"
	hint {
		show on
		description "Virgil Virtual Soundcard (raw, Dante)"
	}
}

# Convenience device with automatic format / channel / rate conversion.
pcm.virgil {
	type plug
	slave.pcm "virgil_hw"
	hint {
		show on
		description "Virgil Virtual Soundcard (Dante)"
	}
}
