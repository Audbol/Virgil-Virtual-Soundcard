# ALSA configuration for the DSV virtual soundcard.
# Install to /etc/alsa/conf.d/ (or include from ~/.asoundrc).

pcm_type.dsv {
	lib "libasound_module_pcm_dsv.so"
}

# Raw device: exact channel count, sample rate and formats of dsvd.
pcm.dsv_hw {
	type dsv
	# shm "/dsv-soundcard"
	hint {
		show on
		description "DSV Virtual Soundcard (raw, AES67/Dante)"
	}
}

# Convenience device with automatic format / channel / rate conversion.
pcm.dsv {
	type plug
	slave.pcm "dsv_hw"
	hint {
		show on
		description "DSV Virtual Soundcard (AES67/Dante)"
	}
}
