# DSV virtual soundcard configuration (installed default).
# Full reference: dsv.conf.example next to the DSV documentation.
# Restart the daemon after editing:
#   Linux:   sudo systemctl restart dsvd
#   macOS:   sudo launchctl kickstart -k system/org.dsv.dsvd
#   Windows: Start menu > DSV > Restart DSV service

[device]
name = DSV Virtual Soundcard
# Network interface of the Dante / AES67 network (name or IPv4 address).
# Empty = first active non-loopback interface.
interface =
sample_rate = 48000
tx_channels = 8
rx_channels = 8
packet_time_us = 1000
latency_us = 2000
clock = ptp
sap = true

[ptp]
domain = 0

# Computer -> network: one 8-channel AES67 multicast flow.
[tx]
name = DSV 1-8
address = 239.69.83.67
port = 5004
first_channel = 1
channels = 8

# Network -> computer: subscribe to a flow announced on the network.
# 'dsvd --discover' lists names, e.g. a Dante device's AES67 flow:
# [rx]
# sap_name = My-Dante-Device : 32
# first_channel = 1
# channels = 8
