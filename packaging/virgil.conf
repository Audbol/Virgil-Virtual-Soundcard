# Virgil virtual soundcard configuration (installed default).
# Full reference: virgil.conf.example next to the Virgil documentation.
# Restart the daemon after editing (the control panel does this for you):
#   Linux:   sudo systemctl restart virgild
#   macOS:   sudo launchctl kickstart -k system/org.virgil.virgild
#   Windows: Start menu > Virgil > Restart Virgil service

[device]
# Name shown in Dante Controller (letters, digits, '-', '_', spaces; max 31).
# The stock name "Virgil" is replaced by Virgil-<computer name> on first
# start, so computers running Virgil do not clash in Dante Controller.
name = Virgil
# Network interface on the Dante network (name or IPv4 address).
# Empty = first active non-loopback interface.
interface =
sample_rate = 48000
tx_channels = 8
rx_channels = 8
# Receive latency: how long received audio is buffered before apps record it.
latency_us = 4000
# Transmit latency: how far ahead of the clock playback is sent (at least
# two ticks + 1.5 ms: 3.5 ms at the default 1 ms tick).
tx_latency_us = 4000
clock = ptp
# Dante control ports: auto (standard 4440/8800/4455/8700, or 24440-24443
# when other Dante software here already uses them), standard, or the first
# of four ports.
# ports = auto
# false = stopped: off the Dante network until started again. Set by
# Stop / Start in Virgil Control.
# enabled = true

[ptp]
# Become the Dante clock leader when no other device provides a clock
# (Virgil Control: "Become clock leader when no Dante device provides one").
master_capable = false
