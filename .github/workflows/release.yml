name: Release

# Builds the downloads and publishes them as a GitHub Release when a version
# tag (v1.2.3) is pushed, or when run by hand with a version (the tag is then
# created on the commit the run was started from). Run by hand, `platforms`
# limits the build and the release to one platform, e.g. while fixing an
# issue that only affects that one. Branch pushes are covered by CI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this tag (e.g. v0.2.0); empty = build only"
        required: false
        default: ""
      platforms:
        description: "Which platforms to build and release"
        type: choice
        options: [all, windows, macos, linux, raspberry-pi]
        default: all
      draft:
        description: "Create the release as a private draft (visible to maintainers only until published)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # A release must carry the version it is built with: refuse a tag (or a
  # hand-run version) that differs from project(VERSION) in CMakeLists.txt,
  # before anything is built. Build-only runs (no version) skip the check.
  version-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the CMake project version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
        run: |
          [ -n "$TAG" ] || { echo "No release version: build only."; exit 0; }
          want=$(sed -n 's/^project([^ ]* VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          have=${TAG#v}
          if [ -z "$want" ]; then
            echo "::error::Could not read project(VERSION) from CMakeLists.txt"
            exit 1
          fi
          if [ "$have" != "$want" ]; then
            echo "::error::Release version $TAG does not match project(VERSION $want) in CMakeLists.txt"
            exit 1
          fi
          echo "Release $TAG matches CMakeLists.txt ($want)."

  linux-packages:
    needs: version-check
    if: ${{ github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux' }}
    # Oldest supported runner, so the packages install on Debian 12 /
    # Ubuntu 22.04 and newer (libc6 >= 2.34, libasound2).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: .github/apt-install.sh libasound2-dev libgtk-3-dev rpm dpkg-dev
      - run: packaging/linux/build-packages.sh all
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: "dist/*" }

  linux-portable:
    needs: version-check
    if: ${{ github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux' }}
    # Oldest supported runner: the tarball then runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: .github/apt-install.sh libasound2-dev libgtk-3-dev
      - run: packaging/linux/build-packages.sh portable
      - uses: actions/upload-artifact@v4
        with: { name: linux-portable, path: "dist/*.tar.gz" }

  raspberry-pi:
    needs: version-check
    if: ${{ github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'raspberry-pi' }}
    # 64-bit ARM .deb and tarball, cross-built on the oldest supported runner
    # so they install on Raspberry Pi OS 12 (bookworm) 64-bit and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: .github/setup-arm64-cross.sh
      - run: VIRGIL_ARCH=arm64 packaging/linux/build-packages.sh deb
      - run: VIRGIL_ARCH=arm64 packaging/linux/build-packages.sh portable
      # One-file installer: the .deb with a script that sets everything up.
      - run: packaging/raspberry-pi/build-installer.sh dist/virgil_*_arm64.deb
      - uses: actions/upload-artifact@v4
        with: { name: raspberry-pi, path: "dist/*" }

  windows:
    needs: version-check
    if: ${{ github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows' }}
    # Cross-built with MinGW-w64 + NSIS, the toolchain the installer was
    # developed and tested with; binaries are statically linked.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: .github/apt-install.sh g++-mingw-w64-x86-64 nsis zip
      - run: rustup target add x86_64-pc-windows-gnu
      - name: Fetch the Steinberg ASIO SDK (not redistributed with Virgil)
        run: |
          curl -fsSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          unzip -q asiosdk.zip -d asio
          echo "ASIO_SDK_DIR=$(find "$PWD/asio" -maxdepth 3 -name asio.h -path '*/common/*' -printf '%h\n' | head -1 | xargs dirname)" >> "$GITHUB_ENV"
      # The ASIO driver is distributed under the GPLv3 option of the ASIO SDK
      # licence: refuse to build a release from an SDK that does not offer it.
      - name: Check the ASIO SDK licence
        run: |
          lic=$(grep -rlis "GNU GENERAL PUBLIC LICENSE" asio | head -1 || true)
          if [ -z "$lic" ]; then
            echo "::error::The downloaded ASIO SDK does not offer the GPLv3; not building a distributable ASIO driver."
            exit 1
          fi
          echo "GPLv3 licence text found in the ASIO SDK: $lic"
          head -20 "$lic"
      - run: packaging/windows/build-installer.sh
      # GPL corresponding source for the parts of the ASIO SDK compiled into
      # VirgilAsio.dll (three headers), with Steinberg's licence files.
      - name: Package ASIO SDK source used by the driver
        run: |
          mkdir -p asio-src
          cp "$ASIO_SDK_DIR"/common/asio.h "$ASIO_SDK_DIR"/common/asiosys.h "$ASIO_SDK_DIR"/common/iasiodrv.h asio-src/
          find asio -maxdepth 3 -type f \( -iname '*licen*' -o -iname '*copying*' -o -iname 'readme*' \) -exec cp {} asio-src/ \;
          (cd asio-src && zip -q ../dist/asio-sdk-headers-source.zip *)
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*" }

  macos:
    needs: version-check
    if: ${{ github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos' }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Signing needs the Developer ID certificate in a keychain on the runner.
      # Without the MACOS_CERT_P12 secret (base64 .p12) the identity secrets
      # are ignored and the package is built unsigned (ad-hoc signed), as
      # before. Notarisation additionally needs MACOS_NOTARY_APPLE_ID,
      # MACOS_NOTARY_TEAM_ID and MACOS_NOTARY_PASSWORD (app-specific password).
      - name: Import the signing certificate (only when the secrets are set)
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CODESIGN_ID: ${{ secrets.MACOS_CODESIGN_ID }}
          INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret: building an unsigned (ad-hoc signed) package."
            exit 0
          fi
          kc="$RUNNER_TEMP/virgil-signing.keychain-db"
          kcpw=$(openssl rand -hex 24)
          printf '%s' "$CERT_P12" | base64 --decode >"$RUNNER_TEMP/virgil-cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/virgil-cert.p12" -k "$kc" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/virgil-cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          [ -n "$CODESIGN_ID" ] && echo "VIRGIL_CODESIGN_ID=$CODESIGN_ID" >>"$GITHUB_ENV"
          [ -n "$INSTALLER_ID" ] && echo "VIRGIL_INSTALLER_ID=$INSTALLER_ID" >>"$GITHUB_ENV"
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            xcrun notarytool store-credentials virgil-notary --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$kc"
            echo "VIRGIL_NOTARY_PROFILE=virgil-notary" >>"$GITHUB_ENV"
            echo "VIRGIL_NOTARY_KEYCHAIN=$kc" >>"$GITHUB_ENV"
          fi
          echo "VIRGIL_SIGNING_KEYCHAIN=$kc" >>"$GITHUB_ENV"
      - name: Build .pkg and portable zip
        run: packaging/macos/build-pkg.sh
      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${VIRGIL_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$VIRGIL_SIGNING_KEYCHAIN" || true
          fi
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "dist/*" }

  publish:
    # Runs when every selected platform built; platforms left out are skipped.
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure') &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))) }}
    needs: [version-check, linux-packages, linux-portable, raspberry-pi, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && ls -l
      # Uses the preinstalled GitHub CLI so no third-party action is needed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}
          DRAFT: ${{ github.event.inputs.draft || 'false' }}
        run: |
          notes=packaging/release-notes.md
          if [ "$PLATFORMS" != all ]; then
            case "$PLATFORMS" in
              windows) label=Windows ;; macos) label=macOS ;; linux) label=Linux ;;
              raspberry-pi) label="Raspberry Pi" ;; *) label=$PLATFORMS ;;
            esac
            { echo "> **This release only contains the $label downloads.** For other platforms, use the latest release that has them."
              echo; cat packaging/release-notes.md; } > "$RUNNER_TEMP/notes.md"
            notes=$RUNNER_TEMP/notes.md
          fi
          prerelease=""
          case "$TAG" in v0.*) prerelease="--prerelease" ;; esac
          # A draft has no tag yet; publishing it on GitHub creates the tag.
          draft=""
          [ "$DRAFT" = true ] && draft="--draft"
          # A new build of an unpublished draft replaces it (published
          # releases are never touched: creating one again fails instead).
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Virgil $TAG" --notes-file "$notes" --generate-notes \
            $prerelease $draft
