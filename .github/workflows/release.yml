name: Release

# Builds every download on each push (kept as workflow artifacts) and
# publishes them as a GitHub Release when a version tag (v1.2.3) is pushed,
# or when run by hand with a version: the tag is then created on the
# commit the run was started from.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  linux-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev rpm dpkg-dev
      - run: packaging/linux/build-packages.sh all
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: "dist/*" }

  linux-portable:
    # Oldest supported runner: the tarball then runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: packaging/linux/build-packages.sh portable
      - uses: actions/upload-artifact@v4
        with: { name: linux-portable, path: "dist/*.tar.gz" }

  windows:
    # Cross-built with MinGW-w64 + NSIS, the toolchain the installer was
    # developed and tested with; binaries are statically linked.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 nsis zip
      - name: Fetch the Steinberg ASIO SDK (not redistributed with DSV)
        run: |
          curl -fsSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          unzip -q asiosdk.zip -d asio
          echo "ASIO_SDK_DIR=$(find "$PWD/asio" -maxdepth 3 -name asio.h -path '*/common/*' -printf '%h\n' | head -1 | xargs dirname)" >> "$GITHUB_ENV"
      - run: packaging/windows/build-installer.sh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*" }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build .pkg and portable zip
        env:
          DSV_CODESIGN_ID: ${{ secrets.MACOS_CODESIGN_ID }}
          DSV_INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
          DSV_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: packaging/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "dist/*" }

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
    needs: [linux-packages, linux-portable, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && ls -l
      # Uses the preinstalled GitHub CLI so no third-party action is needed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DSV $TAG" --notes-file packaging/release-notes.md --generate-notes \
            $prerelease
