name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    if: false  # Windows-only for now; remove this line to re-enable
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: .github/apt-install.sh libasound2-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  macos:
    if: false  # Windows-only for now; remove this line to re-enable
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: VirgilAudio.driver
          path: build/drivers/coreaudio/VirgilAudio.driver

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ASIO SDK (not redistributed with Virgil)
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://www.steinberg.net/asiosdk -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asio
          $sdk = (Get-ChildItem asio -Directory | Select-Object -First 1).FullName
          "ASIO_SDK_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cmake -S . -B build -DASIO_SDK_DIR="${{ env.ASIO_SDK_DIR }}"
      - run: cmake --build build --config Release -j
      - run: ctest --test-dir build -C Release --output-on-failure
